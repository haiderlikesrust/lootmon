map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 8k;

    # Resolve replacement containers without retaining a stale upstream IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://game:8787;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Only Vite's content-hashed files receive long-lived caching.
    location ^~ /assets/ {
        proxy_pass $backend;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        expires 365d;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
    }

    location ~ ^/(?:art|brand|models|fonts)/ {
        proxy_pass $backend;
        proxy_buffering on;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 512;
        gzip_types text/css application/javascript text/javascript image/svg+xml model/gltf-binary;
    }

    location = /ws {
        proxy_pass $backend;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Auth/session responses stay uncompressed and retain no-store headers.
    location /api/ {
        proxy_pass $backend;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass $backend;
    }
}
