services:
  gateway:
    build:
      context: .
      target: gateway
    restart: unless-stopped
    depends_on:
      game:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - dokploy-network
      - app
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  game:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GAME_HOST: 0.0.0.0
      GAME_PORT: "8787"
      GAME_DATA_DIR: /app/.data
      # Exactly Traefik -> Nginx -> private game. Never publish the game port.
      TRUST_PROXY_HOPS: "2"
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to your exact public HTTPS origin}
      DATABASE_URL: postgres://lootmon:${POSTGRES_PASSWORD:?Set a long random alphanumeric POSTGRES_PASSWORD}@postgres:5432/lootmon
      MEMECOIN_MINT: ${MEMECOIN_MINT:-}
      X_ACCOUNT_URL: ${X_ACCOUNT_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY:-}
      JUPITER_API_KEY: ${JUPITER_API_KEY:-}
      COLLECTOR_CRYPT_PAYMENT_WALLET: ${COLLECTOR_CRYPT_PAYMENT_WALLET:-}
      MAINNET_ENABLED: ${MAINNET_ENABLED:-false}
    expose:
      - "8787"
    volumes:
      - lootmon-game-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lootmon
      POSTGRES_DB: lootmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a long random alphanumeric POSTGRES_PASSWORD}
    volumes:
      - lootmon-postgres:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lootmon -d lootmon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lootmon-game-data:
  lootmon-postgres:

networks:
  dokploy-network:
    external: true
  app:
  database:
    internal: true
